name: Build and Sign Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Unzip project if ZIP exists
        run: |
          if ls *.zip 1> /dev/null 2>&1; then
            unzip -o *.zip -d extracted_project
          fi

      - name: Build Release APK
        run: |
          PROJECT_DIR=$(dirname "$(find . -name 'settings.gradle*' -o -name 'gradlew' | head -n 1)")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          cd "$PROJECT_DIR"
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleRelease
          else
            gradle assembleRelease
          fi

      - name: Generate Keystore and Sign APK
        run: |
          UNSIGNED_APK=$(find "$PROJECT_DIR" -name "*release*.apk" | head -n 1)
          echo "Found APK: $UNSIGNED_APK"

          keytool -genkeypair -v \
            -keystore release-key.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias adminkey \
            -storepass 123456 -keypass 123456 \
            -dname "CN=Admin Panel, OU=App, O=Admin, L=Mumbai, S=MH, C=IN"

          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          "$BUILD_TOOLS/zipalign" -v -p 4 "$UNSIGNED_APK" aligned.apk
          "$BUILD_TOOLS/apksigner" sign \
            --ks release-key.jks \
            --ks-key-alias adminkey \
            --ks-pass pass:123456 \
            --key-pass pass:123456 \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out Admin-Panel-Signed.apk \
            aligned.apk

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Admin-Panel-Signed-APK
          path: Admin-Panel-Signed.apk
