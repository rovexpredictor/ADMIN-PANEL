name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Unzip project if ZIP exists
        run: |
          if ls *.zip 1> /dev/null 2>&1; then
            unzip -o *.zip -d extracted_project
          fi

      - name: Build Debug APK
        run: |
          PROJECT_DIR=$(dirname "$(find . -name 'settings.gradle*' -o -name 'gradlew' | head -n 1)")
          echo "Building in: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Admin-Panel-APK
          path: "**/*.apk"
          
